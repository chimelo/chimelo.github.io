性を可視化する、イラスト・ロゴ・パッケージデザインの制作実績。</p> <div class="article-tags"><span>Illustration</span><span>Logo Design</span><span>Graphic Design</span></div> </header> <div class="article-image"><img src="/assets/logo.png" alt="イラスト・ロゴ・バナー作成作品"></div> <div class="prose article-body"><div class="project-gallery not-prose"> <button type="button" class="gallery-tile" data-gallery-index="0" aria-label="会食エージェント「gurumekko」イラストを拡大して見る"><img src="/assets/gurumekko.png" alt="会食エージェント「gurumekko」イラスト" loading="lazy"><span>会食エージェント「gurumekko」イラスト <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="1" aria-label="定食屋ロゴマークを拡大して見る"><img src="/assets/teishoku.png" alt="定食屋ロゴマーク" loading="lazy"><span>定食屋ロゴマーク <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="2" aria-label="農家ロゴマークを拡大して見る"><img src="/assets/farm.png" alt="農家ロゴマーク" loading="lazy"><span>農家ロゴマーク <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="3" aria-label="不動産屋ロゴマークを拡大して見る"><img src="/assets/estate.png" alt="不動産屋ロゴマーク" loading="lazy"><span>不動産屋ロゴマーク <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="4" aria-label="クレープショップロゴマークを拡大して見る"><img src="/assets/TheCrepes.png" alt="クレープショップロゴマーク" loading="lazy"><span>クレープショップロゴマーク <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="5" aria-label="小児科ロゴマークを拡大して見る"><img src="/assets/clinic.png" alt="小児科ロゴマーク" loading="lazy"><span>小児科ロゴマーク <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="6" aria-label="コーヒーパッケージを拡大して見る"><img src="/assets/coffee.png" alt="コーヒーパッケージ" loading="lazy"><span>コーヒーパッケージ <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="7" aria-label="美容クリニックロゴを拡大して見る"><img src="/assets/logo01.png" alt="美容クリニックロゴ" loading="lazy"><span>美容クリニックロゴ <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="8" aria-label="ロゴマークを拡大して見る"><img src="/assets/logo02.png" alt="ロゴマーク" loading="lazy"><span>ロゴマーク <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="9" aria-label="フィットネスジムロゴを拡大して見る"><img src="/assets/logo03.png" alt="フィットネスジムロゴ" loading="lazy"><span>フィットネスジムロゴ <span aria-hidden="true">↗</span></span></button><button type="button" class="gallery-tile" data-gallery-index="10" aria-label="グルメレビューサイトアイコンを拡大して見る"><img src="/assets/logo04.png" alt="グルメレビューサイトアイコン" loading="lazy"><span>グルメレビューサイトアイコン <span aria-hidden="true">↗</span></span></button> </div> <dialog class="gallery-dialog" aria-labelledby="gallery-title"> <button type="button" class="gallery-close" aria-label="閉じる">×</button> <img class="gallery-detail-image" alt=""> <div class="gallery-detail-copy"><h2 id="gallery-title"></h2><p></p></div> </dialog> <script>(function(){const items = [{"title":"会食エージェント「gurumekko」イラスト","description":"会食エージェントサービスアイコン。コーポレートカラーのティールグリーンが印象的なパンダキャラクター。親しみやすい表情で、会食のコーディネートという「つなぐ」役割を視覚的に表現したマスコットデザインです。","image":"/assets/gurumekko.png"},{"title":"定食屋ロゴマーク","description":"コンペ作品。現代的な清潔感とほっと一息つける暖かなイメージで、シンプルで親しみやすい定食屋のロゴマーク。","image":"/assets/teishoku.png"},{"title":"農家ロゴマーク","description":"コンペ作品。有機栽培の新鮮さを表現した、円形の農場ロゴ。みずみずしいグリーンの配色と手描き風のレタリングで、「土から生まれる自然の恵み」をストレートに伝える親しみやすいブランドマークです。","image":"/assets/farm.png"},{"title":"不動産屋ロゴマーク","description":"コンペ作品。信頼感のあるロイヤルブルーと、シンプルな家のアイコンで構成した不動産会社のコーポレートロゴ。堅実で安心感のある印象を与えながら、親しみやすさも両立させたデザインです。","image":"/assets/estate.png"},{"title":"クレープショップロゴマーク","description":"コンペ作品。モダンでミニマルなタイポグラフィが印象的なクレープ専門店のロゴ。シンプルな線で構成されたスタイリッシュなデザインは、Instagram映えを意識した若い女性客層にぴったりのブランド感を演出しま。","image":"/assets/TheCrepes.png"},{"title":"小児科ロゴマーク","description":"コンペ作品。安心感と優しさをテーマに、親子が寄り添うイメージを抽象化した、温もりのあるデザイン。","image":"/assets/clinic.png"},{"title":"コーヒーパッケージ","description":"コンペ作品。豊かな香りと産地の情景を想起させる、質感にこだわったミニマルなパッケージデザイン。","image":"/assets/coffee.png"},{"title":"美容クリニックロゴ","description":"清潔感のあるホワイトとゴールドの配色で、洗練されたクリニックを表現。韓国の美容医療業界で培われた洗練されたデザインアプローチを取り入れ、グローバルスタンダードに対応する技術力と品格を兼ね備えたブランドイメージを構築しました。シンプルでミニマルな造形に、トレンド感と高級感を融合させ、質と信頼性を訴求するデザインとしています。","image":"/assets/logo01.png"},{"title":"ロゴマーク","description":"ロゴマーク作品。","image":"/assets/logo02.png"},{"title":"フィットネスジムロゴ","description":"コンペ作品。流れるような曲線を活かしたモダンなフィットネスジムのロゴ。動きと躍動感を表現したフォルムで、健康的でアクティブなライフスタイルをサポートするブランドイメージを構築しています。","image":"/assets/logo03.png"},{"title":"グルメレビューサイトアイコン","description":"交差したフォークとスプーンをピンクの配色でデザインしたシンボリックなロゴ。洗練されたミニマルなフォルムで、グルメ・食事関連サービスの品質とセンスの良さをアピールします。","image":"/assets/logo04.png"}];

	const dialog = document.querySelector('.gallery-dialog');
	for (const tile of document.querySelectorAll('[data-gallery-index]')) {
		tile.addEventListener('click', () => {
			const item = items[Number(tile.dataset.galleryIndex)];
			const image = dialog.querySelector('img');
			image.src = item.image;
			image.alt = item.title;
			dialog.querySelector('h2').textContent = item.title;
			dialog.querySelector('p').textContent = item.description;
			dialog.showModal();
			document.body.style.overflow = 'hidden';
		});
	}
	dialog.querySelector('.gallery-close').addEventListener('click', () => dialog.close());
	dialog.addEventListener('click', (event) => {
		if (event.target !== dialog) return;
		const rect = dialog.getBoundingClientRect();
		if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
	});
	dialog.addEventListener('close', () => { document.body.style.overflow = ''; });
})();</script><p>このページはギャラリーレイアウトを使用しています。
